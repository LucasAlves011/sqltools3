name: Build and Release

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SQLTools x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQLTools Solution (Release x64)
        run: |
          msbuild SQLTools\SQLTools.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion="10.0" /m /v:m

      - name: Prepare Release Package
        shell: pwsh
        run: |
          # o nome do exe leva a versao definida em VersionInfo.rh (a mesma que o programa exibe)
          $line = Select-String -Path "SQLTools\VersionInfo.rh" -Pattern 'SQLTOOLS_RELEASE_STR\s+"SQLTools\s+([^"]+)"'
          if (-not $line) { throw "Cannot read the version from SQLTools\VersionInfo.rh" }
          $ver = $line.Matches[0].Groups[1].Value.Trim()
          $exeName = "SQLTools-v$ver-x64.exe"
          Copy-Item "_output_\Release.x64\SQLTools.exe" -Destination $exeName
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQLTools-Release-x64
          path: ${{ env.EXE_NAME }}

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: pwsh
        run: |
          # as notas aparecem no aviso de atualizacao do SQLTools
          $ver = "${{ github.event.release.tag_name || github.ref_name }}" -replace '^v\.?', ''
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?s)(?:^|\r?\n)' + [regex]::Escape($ver) + '\r?\n-+\r?\n(.*?)(?=\r?\n(?:[ \t]*\r?\n)+\d|\z)'
          $m = [regex]::Match($text, $pattern)
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            $notes = $m.Groups[1].Value.Trim()
          } else {
            $notes = "See CHANGELOG.md for the changes in this version."
          }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: release_notes.md
          files: ${{ env.EXE_NAME }}
