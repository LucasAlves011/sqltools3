name: Build and Release

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SQLTools x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQLTools Solution (Release x64)
        run: |
          msbuild SQLTools\SQLTools.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion="10.0" /m /v:m

      - name: Prepare Release Package
        shell: pwsh
        run: |
          Copy-Item "_output_\Release.x64\SQLTools.exe" -Destination "SQLTools.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQLTools-Release-x64
          path: SQLTools.exe

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: SQLTools.exe
